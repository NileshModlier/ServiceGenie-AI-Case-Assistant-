name: Foundation and Apex tests

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate foundation and Apex test layer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository tests
        run: python -m unittest discover -s tests -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Run Lightning Web Component tests
        run: npm ci && npm run test:unit
